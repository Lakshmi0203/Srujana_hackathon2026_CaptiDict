services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: srujana
    ports:
      - "5432:5432"
    volumes:
      - srujana_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d srujana"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  srujana_pgdata:
